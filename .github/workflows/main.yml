name: ELISE KERNEL (ReSukiSU Root-Capable)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      model:
        description: "Device model (g950x, g950x_kor, g955x, g955x_kor, n950x, n950x_kor)"
        required: false
        default: g950x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            zip \
            python3 \
            rsync \
            dwarves

      - name: Setup AOSP Clang Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          TC_DIR="${PWD}/tc/clang-498229"

          if [ ! -d "${TC_DIR}" ]; then
            git clone \
              --depth=1 \
              -b 17 \
              https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
              "${TC_DIR}"
          fi

          echo "${TC_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Integrate pinned ReSukiSU
        shell: bash
        run: |
          set -Eeuo pipefail

          RESUKISU_COMMIT="6ec8d9a8a8be30878c388504cacf8ae7849c757b"

          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          git -C KernelSU checkout --detach "${RESUKISU_COMMIT}"

          if [ ! -d drivers ]; then
            echo "ERROR: drivers/ directory not found in kernel tree"
            exit 1
          fi

          ln -sfn \
            "$(realpath --relative-to=drivers KernelSU/kernel)" \
            drivers/kernelsu

          if ! grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/^[[:space:]]*endmenu/i source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig
          fi

          test -d KernelSU
          test -d drivers/kernelsu
          test -f KernelSU/kernel/tools/static_export_check.mk

          echo "Pinned ReSukiSU commit: ${RESUKISU_COMMIT}"
          echo "Installed ReSukiSU head: $(git -C KernelSU rev-parse HEAD)"

      - name: Patch kernel syscall hooks
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              file = Path(path)
              if not file.is_file():
                  raise FileNotFoundError(f"Missing required file: {path}")
              return file.read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def regex_once(content, pattern, replacement, description):
              updated, count = re.sub(
                  pattern,
                  replacement,
                  content,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL,
              )

              if count == 0:
                  raise RuntimeError(
                      f"{description}: source anchor was not found"
                  )

              return updated

          def add_once(content, marker, insertion, description):
              if insertion.strip() in content:
                  return content

              index = content.find(marker)
              if index < 0:
                  raise RuntimeError(
                      f"{description}: insertion marker was not found"
                  )

              index += len(marker)
              return content[:index] + insertion + content[index:]

          # ------------------------------------------------------------
          # fs/stat.c
          # ------------------------------------------------------------
          path = "fs/stat.c"
          content = read(path)

          declarations = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);
          extern void ksu_handle_newfstat_ret(
                  unsigned int *fd,
                  struct stat __user **statbuf_ptr);
          #endif

          """

          content = add_once(
              content,
              "#include <asm/unistd.h>",
              declarations,
              "fs/stat.c declarations",
          )

          # newfstatat() hook.
          if "ksu_handle_stat(&dfd, &filename, &flag);" not in content:
              content = regex_once(
                  content,
                  r"""(SYSCALL_DEFINE4\(\s*newfstatat\s*,.*?
                      \{\s*
                      \tstruct\s+kstat\s+stat;\s*
                      \tint\s+error;\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """,
                  "fs/stat.c newfstatat hook",
              )

          # newfstat() return hook.
          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in content:
              content = regex_once(
                  content,
                  r"""(SYSCALL_DEFINE2\(\s*newfstat\s*,.*?
                      \tif\s*\(\s*!error\s*\)\s*
                      \terror\s*=\s*cp_new_stat\s*\(\s*&stat\s*,\s*statbuf\s*\)\s*;\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          """,
                  "fs/stat.c newfstat hook",
              )

          # fstatat64() uses the same path hook when this architecture exposes it.
          if "ksu_handle_stat(&dfd, &filename, &flag);" not in content[
              content.find("SYSCALL_DEFINE4(fstatat64")
          :]:
              content = regex_once(
                  content,
                  r"""(SYSCALL_DEFINE4\(\s*fstatat64\s*,.*?
                      \{\s*
                      \tstruct\s+kstat\s+stat;\s*
                      \tint\s+error;\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          """,
                  "fs/stat.c fstatat64 hook",
              )

          # fstat64() return hook. ReSukiSU uses the newfstat return handler.
          if "ksu_handle_newfstat_ret(&fd, &statbuf);" not in content[
              content.find("SYSCALL_DEFINE2(fstat64")
          :]:
              content = regex_once(
                  content,
                  r"""(SYSCALL_DEFINE2\(\s*fstat64\s*,.*?
                      \tif\s*\(\s*!error\s*\)\s*
                      \terror\s*=\s*cp_new_stat64\s*\(\s*&stat\s*,\s*statbuf\s*\)\s*;\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_newfstat_ret(
                  (unsigned int *)&fd,
                  (struct stat __user **)&statbuf);
          #endif
          """,
                  "fs/stat.c fstat64 hook",
              )

          write(path, content)
          print("Patched fs/stat.c")

          # ------------------------------------------------------------
          # fs/exec.c
          # ------------------------------------------------------------
          path = "fs/exec.c"
          content = read(path)

          exec_declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(
                  int *fd,
                  struct filename **filename_ptr,
                  void *argv,
                  void *envp,
                  int *flags);
          #endif

          """

          content = add_once(
              content,
              "#include ",
              "",
              "fs/exec.c",
          ) if False else content

          if "ksu_handle_execveat" not in content:
              include_match = re.search(r"^#include[^\n]*\n", content, re.MULTILINE)
              if not include_match:
                  raise RuntimeError("fs/exec.c: include marker was not found")
              pos = include_match.end()
              content = content[:pos] + exec_declaration + content[pos:]

          if "ksu_handle_execveat(&fd" not in content:
              content = regex_once(
                  content,
                  r"""(static\s+int\s+do_execveat_common\s*\(
                      .*?\)\s*
                      \{\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (ksu_handle_execveat(&fd, &filename, argv, envp, &flags))
                  return -EACCES;
          #endif
          """,
                  "fs/exec.c execveat hook",
              )

          write(path, content)
          print("Patched fs/exec.c")

          # ------------------------------------------------------------
          # fs/open.c
          # ------------------------------------------------------------
          path = "fs/open.c"
          content = read(path)

          open_declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(
                  int *dfd,
                  const char __user **filename_user,
                  int *mode,
                  int *flags);
          #endif

          """

          if "ksu_handle_faccessat" not in content:
              include_match = re.search(r"^#include[^\n]*\n", content, re.MULTILINE)
              if not include_match:
                  raise RuntimeError("fs/open.c: include marker was not found")
              pos = include_match.end()
              content = content[:pos] + open_declaration + content[pos:]

          if "ksu_handle_faccessat(&dfd" not in content:
              content = regex_once(
                  content,
                  r"""(SYSCALL_DEFINE3\(\s*faccessat\s*,.*?
                      \{\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (ksu_handle_faccessat(&dfd, &filename, &mode, NULL))
                  return -EACCES;
          #endif
          """,
                  "fs/open.c faccessat hook",
              )

          write(path, content)
          print("Patched fs/open.c")

          # ------------------------------------------------------------
          # kernel/reboot.c
          # ------------------------------------------------------------
          path = "kernel/reboot.c"
          content = read(path)

          reboot_declaration = r"""
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
                  int magic1,
                  int magic2,
                  unsigned int cmd,
                  void __user **arg);
          #endif

          """

          if "ksu_handle_sys_reboot" not in content:
              include_match = re.search(r"^#include[^\n]*\n", content, re.MULTILINE)
              if not include_match:
                  raise RuntimeError(
                      "kernel/reboot.c: include marker was not found"
                  )
              pos = include_match.end()
              content = content[:pos] + reboot_declaration + content[pos:]

          if "ksu_handle_sys_reboot(magic1" not in content:
              content = regex_once(
                  content,
                  r"""(SYSCALL_DEFINE4\(\s*reboot\s*,.*?
                      \{\s*)""",
                  r"""\1
          #ifdef CONFIG_KSU_MANUAL_HOOK
              if (ksu_handle_sys_reboot(magic1, magic2, cmd, &arg))
                  return -EPERM;
          #endif
          """,
                  "kernel/reboot.c reboot hook",
              )

          write(path, content)
          print("Patched kernel/reboot.c")
          PY

      - name: Fix ReSukiSU SELinux static-export blockers
        shell: bash
        run: |
          set -Eeuo pipefail

          SELINUX_REAL="$(realpath security/selinux)"

          if [ ! -d "${SELINUX_REAL}" ]; then
            echo "ERROR: SELinux directory not found"
            exit 1
          fi

          patch_static() {
            local file="$1"
            local old="$2"
            local new="$3"

            [ -f "${file}" ] || return 0

            if grep -qF "${old}" "${file}"; then
              sed -i "s|${old}|${new}|g" "${file}"
              echo "Patched ${file}: ${old}"
            fi
          }

          patch_static \
            "${SELINUX_REAL}/selinuxfs.c" \
            "static ssize_t (*write_op[])" \
            "ssize_t (*write_op[])"

          patch_static \
            "${SELINUX_REAL}/selinuxfs.c" \
            "static const struct file_operations sel_handle_status_ops" \
            "const struct file_operations sel_handle_status_ops"

          patch_static \
            "${SELINUX_REAL}/selinuxfs.c" \
            "static DEFINE_MUTEX(sel_mutex)" \
            "DEFINE_MUTEX(sel_mutex)"

          patch_static \
            "${SELINUX_REAL}/ss/status.c" \
            "static struct page *selinux_status_page" \
            "struct page *selinux_status_page"

          patch_static \
            "${SELINUX_REAL}/ss/status.c" \
            "static DEFINE_MUTEX(selinux_status_lock)" \
            "DEFINE_MUTEX(selinux_status_lock)"

          patch_static \
            "${SELINUX_REAL}/ss/services.c" \
            "static DEFINE_RWLOCK(policy_rwlock)" \
            "DEFINE_RWLOCK(policy_rwlock)"

          if [ -f "${SELINUX_REAL}/hooks.c" ]; then
            patch_static \
              "${SELINUX_REAL}/hooks.c" \
              "static struct security_operations selinux_ops" \
              "struct security_operations selinux_ops"
          fi

      - name: Generate and force feature defconfig
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL="${{ github.event.inputs.model || 'g950x' }}"

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          chmod +x scripts/config
          make "${MODEL}_defconfig"

          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK

          make olddefconfig

          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' .config

          echo "Required KernelSU options verified."

      - name: Build Kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-unused-function -Wno-unused-variable -Wno-pointer-sign"

          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elise-Kernel-${{ github.event.inputs.model || 'g950x' }}-ReSukiSU-RootCapable
          path: ~/a2n_kernel_*/a2n_kernel_*.zip
          if-no-files-found: error
