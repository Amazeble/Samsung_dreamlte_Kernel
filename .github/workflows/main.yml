name: ELISE KERNEL (ReSukiSU Root-Capable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      model:
        description: 'Device model (g950x, g950x_kor, g955x, g955x_kor, n950x, n950x_kor)'
        required: false
        default: 'g950x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git gcc-aarch64-linux-gnu \
            libssl-dev libelf-dev zip python3 rsync dwarves

      - name: Setup AOSP Clang Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          TC_DIR="$(pwd)/tc/clang-498229"
          if [ ! -d "$TC_DIR" ]; then
            GITLAB_HOST="https://gitlab.com"
            TC_PATH="/ThankYouMario/android_prebuilts_clang-standalone"
            git clone --depth=1 -b 17 "${GITLAB_HOST}${TC_PATH}" "$TC_DIR"
          fi
          echo "$TC_DIR/bin" >> "$GITHUB_PATH"

      - name: Integrate pinned ReSukiSU
        shell: bash
        run: |
          set -Eeuo pipefail

          RESUKISU_COMMIT="6ec8d9a8a8be30878c388504cacf8ae7849c757b"

          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          git -C KernelSU checkout --detach "${RESUKISU_COMMIT}"

          if [ -d drivers ]; then
            ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
            grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
              printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

            grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          else
            echo "ERROR: drivers/ directory not found in kernel tree"
            exit 1
          fi

          test -d KernelSU
          test -d drivers/kernelsu
          test -f KernelSU/kernel/tools/static_export_check.mk

          echo "Pinned ReSukiSU commit: ${RESUKISU_COMMIT}"
          echo "Installed ReSukiSU head: $(git -C KernelSU rev-parse HEAD)"

      - name: Patch kernel syscall hooks (strict)
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import os

          def patch_file(filepath, search, replace):
              if not os.path.exists(filepath):
                  raise FileNotFoundError(f"Missing required file: {filepath}")

              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              count = content.count(search)
              if count != 1:
                  raise RuntimeError(
                      f"{filepath}: expected exactly one match for search text, found {count}"
                  )

              updated = content.replace(search, replace, 1)
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(updated)

              print(f"Successfully patched {filepath}")

          # 1. fs/stat.c
          patch_file(
              "fs/stat.c",
              "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *flags);\n#endif\n\nSYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat(dfd, filename, &stat, flag);"
          )

          patch_file(
              "fs/stat.c",
              "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n\treturn error;",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n#endif\n\nSYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\treturn error;"
          )

          patch_file(
              "fs/stat.c",
              "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n\t\tstruct stat64 __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n\t\tstruct stat64 __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\terror = vfs_fstatat(dfd, filename, &stat, flag);"
          )

          patch_file(
              "fs/stat.c",
              "SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\n{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\tif (!error)\n\t\terror = cp_new_stat64(&stat, statbuf);\n\treturn error;",
              "SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\n{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\tif (!error)\n\t\terror = cp_new_stat64(&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, (struct stat __user **)&statbuf);\n#endif\n\treturn error;"
          )

          # 2. fs/exec.c
          patch_file(
              "fs/exec.c",
              "static int do_execveat_common(int fd, struct filename *filename,\n\t\t\t      struct user_arg_ptr argv,\n\t\t\t      struct user_arg_ptr envp,\n\t\t\t      int flags)\n{\n\treturn _do_execveat_common(fd, filename, argv, envp, flags);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif\n\nstatic int do_execveat_common(int fd, struct filename *filename,\n\t\t\t      struct user_arg_ptr argv,\n\t\t\t      struct user_arg_ptr envp,\n\t\t\t      int flags)\n{\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, argv.ptr.native, envp.ptr.native, &flags);\n#endif\n\treturn _do_execveat_common(fd, filename, argv, envp, flags);"
          )

          # 3. fs/open.c
          patch_file(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\treturn do_faccessat(dfd, filename, mode);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n#endif\n\nSYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\treturn do_faccessat(dfd, filename, mode);"
          )

          # 4. kernel/reboot.c
          patch_file(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\nSYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{"
          )

          patch_file(
              "kernel/reboot.c",
              "\tchar buffer[256];\n\tint ret = 0;\n\n\t/* We only trust the superuser with rebooting the system. */",
              "\tchar buffer[256];\n\tint ret = 0;\n\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\t/* We only trust the superuser with rebooting the system. */"
          )
          PY

      - name: Fix ReSukiSU SELinux static-export blockers
        shell: bash
        run: |
          set -Eeuo pipefail

          SELINUX_REAL="$(realpath security/selinux || true)"
          if [ -z "$SELINUX_REAL" ] || [ ! -d "$SELINUX_REAL" ]; then
            echo "ERROR: SELinux directory not found"
            exit 1
          fi

          echo "SELinux source directory: $SELINUX_REAL"

          patch_static() {
            local file="$1"
            local pattern="$2"
            local replacement="$3"

            if [ ! -f "$file" ]; then
              echo "Skipping missing file: $file"
              return
            fi

            if grep -qF "$pattern" "$file"; then
              sed -i "s|$pattern|$replacement|g" "$file"
              echo "Patched: $file"
            else
              echo "Pattern not found in $file: $pattern"
            fi
          }

          # selinuxfs.c
          patch_static "$SELINUX_REAL/selinuxfs.c" \
            "static ssize_t (*write_op[])" \
            "ssize_t (*write_op[])"

          patch_static "$SELINUX_REAL/selinuxfs.c" \
            "static const struct file_operations sel_handle_status_ops" \
            "const struct file_operations sel_handle_status_ops"

          patch_static "$SELINUX_REAL/selinuxfs.c" \
            "static DEFINE_MUTEX(sel_mutex)" \
            "DEFINE_MUTEX(sel_mutex)"

          # status.c
          patch_static "$SELINUX_REAL/ss/status.c" \
            "static struct page *selinux_status_page" \
            "struct page *selinux_status_page"

          patch_static "$SELINUX_REAL/ss/status.c" \
            "static DEFINE_MUTEX(selinux_status_lock)" \
            "DEFINE_MUTEX(selinux_status_lock)"

          # services.c
          patch_static "$SELINUX_REAL/ss/services.c" \
            "static DEFINE_RWLOCK(policy_rwlock)" \
            "DEFINE_RWLOCK(policy_rwlock)"

          # hooks.c (for older kernels)
          if [ -f "$SELINUX_REAL/hooks.c" ]; then
            patch_static "$SELINUX_REAL/hooks.c" \
              "static struct security_operations selinux_ops" \
              "struct security_operations selinux_ops"
          fi

          # Additional compatibility guard for kernels with static symbols
          for file in \
            "$SELINUX_REAL/selinuxfs.c" \
            "$SELINUX_REAL/ss/status.c" \
            "$SELINUX_REAL/ss/services.c" \
            "$SELINUX_REAL/hooks.c"
          do
            [ -f "$file" ] || continue
            echo "--- verifying $file ---"
            grep -nE 'static .*write_op|static .*sel_handle_status_ops|static .*sel_mutex|static .*selinux_status_page|static .*selinux_status_lock|static .*policy_rwlock|static .*selinux_ops' "$file" || true
          done

      - name: Generate & Force Feature Defconfig
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL="${{ github.event.inputs.model || 'g950x' }}"
          chmod +x scripts/config

          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make ARCH=arm64 "${MODEL}_defconfig"

          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL

          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK

          make ARCH=arm64 olddefconfig

          echo "=== Verifying Critical Dependencies ==="
          MISSING=0

          if ! grep -q "CONFIG_KSU_MANUAL_HOOK=y" .config; then
            echo "FATAL: CONFIG_KSU_MANUAL_HOOK is missing!"
            MISSING=1
          else
            echo "CONFIG_KSU_MANUAL_HOOK=y verified."
          fi

          if ! grep -q "CONFIG_KSU=y" .config; then
            echo "FATAL: CONFIG_KSU is missing!"
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "=== Dumping relevant .config lines for debugging ==="
            grep -iE "KSU|MANUAL_HOOK" .config || true
            exit 1
          fi

          echo "All critical dependencies verified successfully. Proceeding to build..."

      - name: Build Kernel using fixed build.sh
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x build.sh

          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          export KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-unused-function -Wno-unused-variable -Wno-pointer-sign"

          ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elise-Kernel-${{ github.event.inputs.model || 'g950x' }}-ReSukiSU-RootCapable
          path: ~/a2n_kernel_*/a2n_kernel_*.zip
