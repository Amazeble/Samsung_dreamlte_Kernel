name: Build Kernel with ReSukiSU

on:
  # Trigger automatically when you push to main/master
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      model:
        description: 'Device Model (g950x, g955x, n950x, etc.)'
        required: false
        default: 'g950x'

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev zip unzip python3 git wget cpio bc curl
          
      - name: Set up Android Image Kitchen (AIK)
        run: |
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git $HOME/AIK-Linux
          chmod +x $HOME/AIK-Linux/*.sh
          
      - name: Prepare Workspace for Build Script
        run: |
          # Your build.sh expects the kernel source in $HOME/Samsung_dreamlte_Kernel
          # We symlink the current GitHub workspace to that path so it doesn't have to re-clone
          ln -sf $GITHUB_WORKSPACE $HOME/Samsung_dreamlte_Kernel
          
      - name: Integrate ReSukiSU & Apply Manual Hooks
        run: |
          cd $HOME/Samsung_dreamlte_Kernel
          
          # 1. Download and run ReSukiSU setup script
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          
          # 2. Add ReSukiSU configs to ALL defconfigs
          for defconfig in arch/arm64/configs/*_defconfig; do
            if [ -f "$defconfig" ]; then
              echo "" >> "$defconfig"
              echo "# ReSukiSU" >> "$defconfig"
              echo "CONFIG_KSU=y" >> "$defconfig"
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$defconfig"
              # Enable auto-hooks to avoid manual patching where possible
              echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> "$defconfig"
              echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> "$defconfig"
              echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> "$defconfig"
            fi
          done
          
          # 3. Inject Manual Hooks for Kernel 4.4 (Exynos 8895)
          cat << 'PYEOF' > apply_hooks.py
import os, re

def patch_exec():
    path = "fs/exec.c"
    if not os.path.exists(path): return
    with open(path, "r", encoding="utf-8") as f: c = f.read()
    if "ksu_handle_execveat" in c: return
    proto = """#ifdef CONFIG_KSU_MANUAL_HOOK
__attribute__((hot))
extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
extern int ksu_handle_post_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags, int *retval);
#endif
"""
    c = re.sub(r'(?m)^static int do_execveat_common\(', proto + r'static int do_execveat_common(', c)
    hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
    int retval;
    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
    retval = __do_execve_file(fd, filename, argv, envp, flags, NULL);
    ksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);
    return retval;
#else
    return __do_execve_file(fd, filename, argv, envp, flags, NULL);
#endif"""
    c = re.sub(r'(?m)^\s*return __do_execve_file\(fd, filename, argv, envp, flags, NULL\);', hook, c)
    with open(path, "w", encoding="utf-8") as f: f.write(c)
    print("Patched fs/exec.c")

def patch_stat():
    path = "fs/stat.c"
    if not os.path.exists(path): return
    with open(path, "r", encoding="utf-8") as f: c = f.read()
    if "ksu_handle_stat" in c: return
    proto = """#ifdef CONFIG_KSU_MANUAL_HOOK
__attribute__((hot))
extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
#endif
"""
    c = re.sub(r'(?m)^SYSCALL_DEFINE4\(newfstatat,', proto + r'SYSCALL_DEFINE4(newfstatat,', c)
    hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
    ksu_handle_stat(&dfd, &filename, &flag);
#endif
    error = vfs_fstatat(dfd, filename, &stat, flag);"""
    c = re.sub(r'(?m)^\s*error = vfs_fstatat\(dfd, filename, &stat, flag\);', hook, c)
    with open(path, "w", encoding="utf-8") as f: f.write(c)
    print("Patched fs/stat.c")

def patch_open():
    path = "fs/open.c"
    if not os.path.exists(path): return
    with open(path, "r", encoding="utf-8") as f: c = f.read()
    if "ksu_handle_faccessat" in c: return
    proto = """#ifdef CONFIG_KSU_MANUAL_HOOK
__attribute__((hot))
extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
#endif
"""
    c = re.sub(r'(?m)^SYSCALL_DEFINE3\(faccessat,', proto + r'SYSCALL_DEFINE3(faccessat,', c)
    hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
    ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
#endif
    if (mode & ~S_IRWXO)"""
    c = re.sub(r'(?m)^\s*if \(mode & ~S_IRWXO\)', hook, c)
    with open(path, "w", encoding="utf-8") as f: f.write(c)
    print("Patched fs/open.c")

def patch_reboot():
    path = "kernel/reboot.c" if os.path.exists("kernel/reboot.c") else "kernel/sys.c"
    if not os.path.exists(path): return
    with open(path, "r", encoding="utf-8") as f: c = f.read()
    if "ksu_handle_sys_reboot" in c: return
    proto = """#ifdef CONFIG_KSU_MANUAL_HOOK
extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
#endif
"""
    c = re.sub(r'(?m)^SYSCALL_DEFINE4\(reboot,', proto + r'SYSCALL_DEFINE4(reboot,', c)
    hook = """#ifdef CONFIG_KSU_MANUAL_HOOK
    ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
#endif
    /* We only trust the superuser with rebooting the system. */"""
    c = re.sub(r'(?m)^\s*/\* We only trust the superuser with rebooting the system\. \*/', hook, c)
    with open(path, "w", encoding="utf-8") as f: f.write(c)
    print(f"Patched {path}")

patch_exec()
patch_stat()
patch_open()
patch_reboot()
print("KernelSU Manual Hooks Applied!")
PYEOF
          python3 apply_hooks.py
          
      - name: Run Build Script
        run: |
          # Determine model (use workflow input if manual, otherwise default to g950x)
          MODEL="${{ github.event.inputs.model || 'g950x' }}"
          chmod +x build.sh
          
          # Update MODEL variable in build.sh dynamically
          sed -i "s/^MODEL=.*/MODEL=$MODEL/" build.sh
          
          # Fix a common bash trap error with 'rm $DTB' if multiple files exist
          sed -i 's/rm \$DTB/rm -f $DTB/' build.sh
          
          # Run the script
          ./build.sh
          
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ github.event.inputs.model || 'g950x' }}
          path: |
            ~/a2n_kernel_*/a2n_kernel_*.zip
            ~/a2n_kernel_*/boot.img
