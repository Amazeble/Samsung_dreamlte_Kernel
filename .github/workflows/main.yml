name: ELISE KERNEL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      model:
        description: "Device model (g950x, g950x_kor, g955x, g955x_kor, n950x, n950x_kor)"
        required: false
        default: g950x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            zip \
            python3 \
            rsync \
            dwarves

      - name: Setup AOSP Clang Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          TC_DIR="${PWD}/tc/clang-498229"

          if [ ! -d "${TC_DIR}" ]; then
            git clone \
              --depth=1 \
              -b 17 \
              https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
              "${TC_DIR}"
          fi

          echo "${TC_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Generate and force feature defconfig
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL="${{ github.event.inputs.model || 'g950x' }}"

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          chmod +x scripts/config
          make "${MODEL}_defconfig"

          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL

          make olddefconfig

          echo "Required kernel options verified."

      - name: Build Kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-unused-function -Wno-unused-variable -Wno-pointer-sign"

          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elise-Kernel-${{ github.event.inputs.model || 'g950x' }}
          path: ~/a2n_kernel_*/a2n_kernel_*.zip
          if-no-files-found: error
