name: ELISE KERNEL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      model:
        description: "Device model (g950x, g950x_kor, g955x, g955x_kor, n950x, n950x_kor)"
        required: false
        default: g950x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor in rtw88 (RTL8812AU) driver from NetHunter tree
        run: |
          set -euo pipefail
          GIT_HOST="https://github.com"
          DRIVER_PATH="/akabul0us/android_kernel_xiaomi_surya_nethunter.git"
          git clone --depth=1 --branch rebase-2-electric-boogaloo "${GIT_HOST}${DRIVER_PATH}" /tmp/nethunter
          
          mkdir -p drivers/net/wireless/realtek
          cp -r /tmp/nethunter/drivers/net/wireless/realtek/rtw88 drivers/net/wireless/realtek/rtw88
          rm -rf /tmp/nethunter
          
          # Apply critical patches to rtw88 driver
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/NL80211_SCAN_FLAG_RANDOM_SN/NL80211_SCAN_FLAG_RANDOM_ADDR/g' {} +
          find drivers/net/wireless/realtek/rtw88 -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/RX_FLAG_NO_PSDU/0/g' {} +
          
          # Verify patches were applied
          if grep -r 'NL80211_SCAN_FLAG_RANDOM_SN' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: SN NOT PATCHED"
            exit 1
          else
            echo "SN PATCHED OK"
          fi
          
          if grep -r 'RX_FLAG_NO_PSDU' drivers/net/wireless/realtek/rtw88 > /dev/null; then
            echo "ERROR: PSDU NOT PATCHED"
            exit 1
          else
            echo "PSDU PATCHED OK"
          fi
          
          # Add Kconfig and Makefile entries
          grep -q 'realtek/rtw88/Kconfig' drivers/net/wireless/realtek/Kconfig || \
            sed -i '/source "drivers\/net\/wireless\/realtek\/rtl8xxxu\/Kconfig"/a source "drivers/net/wireless/realtek/rtw88/Kconfig"' drivers/net/wireless/realtek/Kconfig
          grep -q 'CONFIG_RTW88' drivers/net/wireless/realtek/Makefile || \
            echo 'obj-$(CONFIG_RTW88) += rtw88/' >> drivers/net/wireless/realtek/Makefile

      # --- NoMount Integration Step ---
      - name: Integrate NoMount into Kernel Source
        run: |
          set -euo pipefail
          echo "Integrating NoMount (dev branch) into kernel source..."
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev
          echo "NoMount integration completed successfully!"

      # --- KernelSU Next Integration Step ---
      - name: Integrate KernelSU Next (Legacy) into Kernel Source
        run: |
          set -euo pipefail
          echo "Integrating KernelSU Next (legacy branch) into kernel source..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "KernelSU Next integration completed successfully!"

      - name: Generate & Force Feature Defconfig
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 surya_defconfig
          
          # --- KPROBES full dependency chain ---
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --file out/.config --enable CONFIG_TRACING
          ./scripts/config --file out/.config --enable CONFIG_FTRACE
          ./scripts/config --file out/.config --enable CONFIG_FTRACE_SYSCALLS
          ./scripts/config --file out/.config --enable CONFIG_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_KRETPROBES
          ./scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
          
          # --- KernelSU Next: FORCE kprobe hooks, DISABLE manual hooks ---
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --disable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KSU_KPROBES_HOOK
          
          # --- Other features ---
          ./scripts/config --file out/.config --enable CONFIG_KPM
          ./scripts/config --file out/.config --enable CONFIG_EXT4_FS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file out/.config --enable CONFIG_PACKET
          ./scripts/config --file out/.config --enable CONFIG_USB_GADGET
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --enable CONFIG_USB_LIBCOMPOSITE
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_FS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_FS
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_UEVENT
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config --enable CONFIG_USB_F_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_F_MASS_STORAGE
          ./scripts/config --file out/.config --enable CONFIG_USB_F_HID
          ./scripts/config --file out/.config --enable CONFIG_BT
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB_BCM
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB_RTL
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB_MTK
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --enable CONFIG_RTW88
          ./scripts/config --file out/.config --enable CONFIG_RTW88_CORE
          ./scripts/config --file out/.config --enable CONFIG_RTW88_USB
          ./scripts/config --file out/.config --enable CONFIG_RTW88_8812A
          ./scripts/config --file out/.config --module CONFIG_RTW88_8812AU
          
          # --- NoMount ---
          ./scripts/config --file out/.config --enable CONFIG_NOMOUNT
          
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # --- STRICT VERIFICATION ---
          echo "=== Verifying KernelSU Next dependencies ==="
          MISSING=0
          
          if ! grep -q "CONFIG_KPROBES=y" out/.config; then
            echo "FATAL: CONFIG_KPROBES was dropped by olddefconfig!"
            MISSING=1
          fi
          
          if ! grep -q "CONFIG_KRETPROBES=y" out/.config; then
            echo "FATAL: CONFIG_KRETPROBES was dropped by olddefconfig!"
            MISSING=1
          fi
          
          if ! grep -q "CONFIG_KPROBE_EVENTS=y" out/.config; then
            echo "FATAL: CONFIG_KPROBE_EVENTS was dropped by olddefconfig!"
            MISSING=1
          fi
          
          if ! grep -q "CONFIG_KSU=y" out/.config; then
            echo "FATAL: CONFIG_KSU is missing! KernelSU Next setup.sh may have failed."
            MISSING=1
          fi
          
          if ! grep -q "CONFIG_KSU_KPROBES_HOOK=y" out/.config; then
            echo "WARNING: CONFIG_KSU_KPROBES_HOOK was dropped!"
            echo "  Checking if KSU_MANUAL_HOOK was auto-enabled as fallback..."
            if grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config; then
              echo "  -> KSU_MANUAL_HOOK is active. Kprobe hooks cannot be used."
              echo "  -> This kernel likely lacks HAVE_SYSCALL_TRACEPOINTS."
              echo "  -> KernelSU will still work using manual hooks."
              echo "  -> Proceeding with MANUAL HOOK mode."
              MISSING=0
            else
              echo "  -> Neither KSU_KPROBES_HOOK nor KSU_MANUAL_HOOK is enabled!"
              MISSING=1
            fi
          else
            echo "CONFIG_KSU_KPROBES_HOOK=y verified."
          fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "=== Dumping relevant .config lines for debugging ==="
            grep -iE "KPROBE|KSU|KRETPROBE|TRACING|FTRACE|MODULES|TRACEPOINT" out/.config || true
            exit 1
          fi
          
          echo "All KernelSU Next dependencies verified successfully."

          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elise-Kernel-${{ github.event.inputs.model || 'g950x' }}
          path: ~/a2n_kernel_*/a2n_kernel_*.zip
          if-no-files-found: error
