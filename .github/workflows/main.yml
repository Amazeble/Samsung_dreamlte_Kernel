name: ELISE KERNEL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      model:
        description: "Device model (g950x, g950x_kor, g955x, g955x_kor, n950x, n950x_kor)"
        required: false
        default: g950x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ReSukiSU Base
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Setting up ReSukiSU directory structure, Makefile, and Kconfig..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply ReSukiSU Manual Hooks (Automated for Legacy Kernels)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Downloading automated manual hook patch script for legacy kernels (4.4 - 5.4)..."
          curl -LSs "https://raw.githubusercontent.com/xiaoleGun/KernelSU_Action/main/patches/legacy_ksu_hooks.sh" -o /tmp/legacy_ksu_hooks.sh
          chmod +x /tmp/legacy_ksu_hooks.sh
          
          echo "Applying ReSukiSU manual hooks to kernel source..."
          bash /tmp/legacy_ksu_hooks.sh
          
          # Additional safeguard for sys_reboot hook (required by ReSukiSU docs)
          # Guard against duplicate declarations and calls
          if [ -f "kernel/reboot.c" ] && ! grep -q "ksu_handle_sys_reboot" "kernel/reboot.c"; then
            echo "Applying sys_reboot hook to kernel/reboot.c..."
            sed -i '/SYSCALL_DEFINE4(reboot,/i\#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);\n#endif' kernel/reboot.c
            sed -i '/kernel_restart(cmd);/i\\t#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, arg);\n\t#endif' kernel/reboot.c
          elif [ -f "kernel/sys.c" ] && ! grep -q "ksu_handle_sys_reboot" "kernel/sys.c"; then
            echo "Applying sys_reboot hook to kernel/sys.c (legacy fallback)..."
            sed -i '/SYSCALL_DEFINE4(reboot,/i\#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);\n#endif' kernel/sys.c
            sed -i '/kernel_restart(cmd);/i\\t#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, arg);\n\t#endif' kernel/sys.c
          fi
          
          echo "Verifying hook application..."
          grep -l "ksu_handle" fs/exec.c fs/open.c fs/stat.c || echo "Note: Some hooks may already be present or target function names differ slightly in your specific tree."

      - name: Verify ReSukiSU integration after hooks
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Rnw --include='*.c' --include='*.h' \
            -e 'write_op' security fs kernel || {
              echo "ReSukiSU SELinux write_op export is missing"
              exit 1
            }

          grep -Rnw --include='*.c' --include='*.h' \
            -e 'ksu_handle_' fs kernel security || {
              echo "ReSukiSU manual hooks are missing"
              exit 1
            }

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            zip \
            python3 \
            rsync \
            dwarves \
            sed

      - name: Setup AOSP Clang Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          TC_DIR="${PWD}/tc/clang-498229"

          if [ ! -d "${TC_DIR}" ]; then
            git clone \
              --depth=1 \
              -b 17 \
              https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
              "${TC_DIR}"
          fi

          echo "${TC_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Generate and force feature defconfig
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL="${{ github.event.inputs.model || 'g950x' }}"

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          chmod +x scripts/config
          make "${MODEL}_defconfig"

          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          
          # CONFIG_KALLSYMS_ALL satisfies the "Static symbol export" requirement 
          # from ReSukiSU docs, preventing compilation failures related to 
          # security/selinux/selinuxfs.c (write_op and sel_handle_status_ops)
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          
          # ReSukiSU Configuration
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KSU_MANUAL_HOOK

          make olddefconfig

          echo "Required kernel options (including ReSukiSU manual hooks) verified."

      - name: Verify ReSukiSU integration before build
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q '^CONFIG_KALLSYMS_ALL=y$' .config || {
            echo "ERROR: CONFIG_KALLSYMS_ALL is not enabled after Generate step"
            exit 1
          }
          grep -Rnw --include='*.c' --include='*.h' \
            -e 'write_op' security fs kernel || {
              echo "ReSukiSU SELinux write_op export is missing"
              exit 1
            }

          grep -Rnw --include='*.c' --include='*.h' \
            -e 'ksu_handle_' fs kernel security || {
              echo "ReSukiSU manual hooks are missing"
              exit 1
            }

      - name: Build Kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-unused-function -Wno-unused-variable -Wno-pointer-sign"

          chmod +x build.sh
          ./build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elise-Kernel-${{ github.event.inputs.model || 'g950x' }}
          path: ~/a2n_kernel_*/a2n_kernel_*.zip
          if-no-files-found: error
